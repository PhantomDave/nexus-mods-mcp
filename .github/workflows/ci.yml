name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch Nexus API changes early
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      # Hits the live Nexus API; trending is checked only when the NEXUS_API_KEY secret is set.
      - run: uv run --python ${{ matrix.python }} server.py --check
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
